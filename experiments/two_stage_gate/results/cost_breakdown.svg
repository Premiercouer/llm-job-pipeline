<text class="mu" x="608.0" y="252" text-anchor="middle">$0.03</text>
<line class="grid" x1="734.0" y1="108" x2="734.0" y2="236"/>
<text class="mu" x="734.0" y="252" text-anchor="middle">$0.04</text>
