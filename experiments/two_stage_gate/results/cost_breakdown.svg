<rect class="s2 gap" x="544.7" y="176" width="276.9" height="34" rx="3"><title>Full screen (stage 2): output $0.0220</title></rect>
<text class="in" x="683.2" y="198" text-anchor="middle">$0.0220</text>
<text class="val" x="829.6" y="198">$0.0469</text>
