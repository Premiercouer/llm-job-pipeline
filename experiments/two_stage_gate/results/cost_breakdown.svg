<text class="lb" x="24" y="131">Gate</text>
<text class="mu" x="24" y="148">n = 150 warm calls</text>
<rect class="s1 gap" x="230.0" y="116" width="284.8" height="34" rx="3"><title>Gate: write posting to cache $0.0226</title></rect>
<text class="in" x="372.4" y="138" text-anchor="middle">$0.0226</text>
<rect class="s3 gap" x="514.8" y="116" width="17.3" height="34" rx="3"><title>Gate: read cached rules $0.0014</title></rect>
