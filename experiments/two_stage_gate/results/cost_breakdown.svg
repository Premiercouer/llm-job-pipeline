<text class="t1" x="24" y="36">Two-stage gate: where the cost goes</text>
<text class="mu" x="24" y="58">Measured warm calls, decomposed with per-token prices fitted to the reported costs. Bottom panel is an estimate (production mix).</text>
<text class="hd" x="24" y="96">Per call</text>
