<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">Why the two-stage gate was not shipped</title>
<desc id="d">Gate call costs $0.0305, of which $0.0226 (74%) is writing the posting to the cache; the full screening call costs $0.0469, of which $0.0225 is the same posting write. Cost per posting on the production mix: single stage $0.0367, two stage $0.0481 (+31%).</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .bg { fill: #FCFCFB; stroke: #E5E4E0; }
  .t1 { fill: #0B0B0B; font-size: 24px; font-weight: 700; }
  .t2 { fill: #52514E; font-size: 15px; }
  .hd { fill: #0B0B0B; font-size: 16px; font-weight: 600; }
  .lb { fill: #0B0B0B; font-size: 15px; }
  .val { fill: #0B0B0B; font-size: 15px; font-weight: 600; }
  .in { fill: #FFFFFF; font-size: 13px; font-weight: 600; }
  .in-dk { fill: #0B0B0B; font-size: 13px; font-weight: 600; }
  .mu { fill: #52514E; font-size: 14px; }
  .lg { fill: #52514E; font-size: 14px; }
  .delta { fill: #0B0B0B; font-size: 15px; font-weight: 700; }
  .s1 { fill: #2A78D6; } .s2 { fill: #EB6834; } .s3 { fill: #1BAF7A; }
  .bar { fill: #8A8986; } .bar2 { fill: #52514E; }
  .axis { stroke: #C9C8C3; stroke-width: 1; }
  .gap { stroke: #FCFCFB; stroke-width: 2; }
  .rule { stroke: #E5E4E0; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1A1A19; stroke: #383835; }
    .t1, .hd, .lb, .val, .delta { fill: #FFFFFF; }
    .t2, .mu, .lg { fill: #C3C2B7; }
    .s1 { fill: #3987E5; } .s2 { fill: #D95926; } .s3 { fill: #199E70; }
    .bar { fill: #8A8986; } .bar2 { fill: #C3C2B7; }
    .axis { stroke: #4A4A46; } .gap { stroke: #1A1A19; } .rule { stroke: #383835; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="1199" height="539" rx="16"/>
<text class="t1" x="40" y="56">Why the two-stage gate was not shipped</text>
<text class="t2" x="40" y="82">Measured on 150 postings · same model in both stages · list prices</text>
<rect class="s1" x="40" y="112" width="14" height="14" rx="3"/>
<text class="lg" x="62" y="124">Posting written to cache</text>
<rect class="s2" x="272.4" y="112" width="14" height="14" rx="3"/>
<text class="lg" x="294.4" y="124">Rules read from cache</text>
<rect class="s3" x="482.0" y="112" width="14" height="14" rx="3"/>
<text class="lg" x="504.0" y="124">Output</text>
<text class="hd" x="40" y="172">Cost of one model call</text>
<text class="lb" x="40" y="222">Gate call</text>
<rect class="s1" x="190" y="196" width="210.2" height="40"/>
<text class="in" x="295.1" y="221" text-anchor="middle">$0.0226 · 74%</text>
<rect class="s2" x="400.2" y="196" width="13.0" height="40"/>
<line class="gap" x1="400.2" y1="196" x2="400.2" y2="236"/>
<path class="s3" d="M413.2 196 H469.6 Q473.6 196 473.6 200 V232 Q473.6 236 469.6 236 H413.2 Z"/>
<line class="gap" x1="413.2" y1="196" x2="413.2" y2="236"/>
<text class="val" x="483.6" y="222">$0.0305</text>
<text class="lb" x="40" y="294">Full screen call</text>
<rect class="s1" x="190" y="268" width="209.2" height="40"/>
<text class="in" x="294.6" y="293" text-anchor="middle">$0.0225 · 48%</text>
<rect class="s2" x="399.2" y="268" width="23.2" height="40"/>
<line class="gap" x1="399.2" y1="268" x2="399.2" y2="308"/>
<path class="s3" d="M422.5 268 H623.1 Q627.1 268 627.1 272 V304 Q627.1 308 623.1 308 H422.5 Z"/>
<line class="gap" x1="422.5" y1="268" x2="422.5" y2="308"/>
<text class="in-dk" x="524.8" y="293" text-anchor="middle">$0.0220</text>
<text class="val" x="637.1" y="294">$0.0469</text>
<line class="axis" x1="190" y1="186" x2="190" y2="318"/>
<text class="mu" x="40" y="376">Both calls must write the whole posting to the cache. Every posting the gate</text>
<text class="mu" x="40" y="396">does not reject pays that write twice; a shorter prompt only trims the cheap cache read.</text>
<line class="rule" x1="760" y1="150" x2="760" y2="400"/>
<text class="hd" x="800" y="172">Cost per posting, production mix</text>
<path class="bar" d="M830 380 V268.4 Q830 264.4 834 264.4 H922 Q926 264.4 926 268.4 V380 Z"/>
<text class="val" x="878.0" y="252.4" text-anchor="middle">$0.0367</text>
<text class="lb" x="878.0" y="404" text-anchor="middle">Single stage</text>
<path class="bar2" d="M1010 380 V232.5 Q1010 228.5 1014 228.5 H1102 Q1106 228.5 1106 232.5 V380 Z"/>
<text class="val" x="1058.0" y="216.5" text-anchor="middle">$0.0481</text>
<text class="delta" x="1120" y="246.5">+31%</text>
<text class="lb" x="1058.0" y="404" text-anchor="middle">Two stage</text>
<line class="axis" x1="810" y1="380" x2="1140" y2="380"/>
<line class="rule" x1="40" y1="438" x2="1160" y2="438"/>
<text class="hd" x="40" y="474">Break-even</text>
<text class="mu" x="140" y="474">The gate saves money only if at most ~9% of postings go on to the full screen.</text>
<text class="mu" x="140" y="498">Measured: 43% on the production mix, 63% in the sample. Even a gate that stopped every posting would save only ~9%.</text>
</svg>
