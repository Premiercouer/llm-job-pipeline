<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">LLM Job Pipeline architecture</title>
<desc id="d">Discovery of postings from public Greenhouse and Ashby board APIs feeds single-turn LLM screening with evidence validation, checkpoints and cross-source dedupe; accepted jobs get a tailored one-page resume (V1, quality review, V2, PDF, trim), which is queued for human review and submission.</desc>
