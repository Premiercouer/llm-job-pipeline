name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    name: public-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_public_safety.py

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "pymupdf>=1.24"
      - name: offline test suites
        run: python tools/run_tests.py

  experiments:
    name: experiments (analysis reproduction, RAG tests + offline demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pymupdf>=1.24" "numpy>=1.26" "scikit-learn>=1.4"
      - name: candidate-fact RAG tests (with the optional rag dependencies)
        run: python tools/run_tests.py experiments
      - name: offline RAG demo (fake generator, fictional candidate and JD)
        run: python experiments/candidate_fact_rag/scripts/demo.py --out "$RUNNER_TEMP/rag-demo"
      - name: published numbers follow from the published data
        run: |
          python experiments/two_stage_gate/scripts/analyze_gate.py --check
          python experiments/candidate_fact_rag/scripts/analyze_dev_results.py --check
          git diff --exit-code -- experiments/

  demo:
    name: offline end-to-end demo
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pymupdf>=1.24"
      - name: run demo (fake model CLI, mock review provider, fictional candidate)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python demo/run_demo.py --workspace "$RUNNER_TEMP/ljp-demo"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-resumes
          path: ${{ runner.temp }}/ljp-demo/resume/jobs/**/resume.pdf
          if-no-files-found: error
