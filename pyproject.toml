[project]
name = "llm-job-pipeline"
version = "0.1.0"
description = "LLM-powered job triage and resume generation: grounded screening, crash-safe external review, one-page resumes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"            # tomllib, X | Y annotations evaluated at runtime
dependencies = [
    "pymupdf>=1.24",                  # resume stage 4: PDF page count / overflow lines
]

[project.optional-dependencies]
api = ["anthropic>=1.0"]               # --backend api: Messages API instead of the Claude Code CLI
rag = ["numpy>=1.26", "scikit-learn>=1.4"]  # experiments/candidate_fact_rag only; the pipeline never needs it
dev = []                              # tests use only the standard library (unittest)

[tool.setuptools]
packages = []                         # scripts are run in place; nothing is installed as a package
